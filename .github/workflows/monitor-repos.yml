name: Monitor Organization Repositories

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run repository monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: LookAtWhatAiCanDo
        run: |
          python monitor_repos.py
      
      - name: Upload snapshots as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-snapshots-${{ github.run_number }}
          path: snapshots/
          retention-days: 90
